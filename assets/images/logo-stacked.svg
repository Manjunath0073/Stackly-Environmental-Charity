    <text x="80" y="118" text-anchor="middle" font-family="'Playfair Display', Georgia, 'Times New Roman', serif" font-weight="400" font-size="26" fill="#1b4d3e" letter-spacing="3" opacity="0.85">EARTH</text>
    <!-- Gold accent line -->
    <rect x="55" y="98" width="50" height="1.2" rx="0.6" fill="url(#sVeinGrad)" opacity="0.5"/>
