      <path d="M32 6C22 14 10 24 10 36c0 10 9.8 18 22 18s22-8 22-18c0-10-12-20-22-30z" fill="url(#sLeafSheen)"/>
      <path d="M32 54c0-16 6-24 14-30-6 4-14 10-14 30z" fill="rgba(15,46,31,0.3)"/>
      <path d="M32 12C32 12 32 28 32 50" stroke="url(#sVeinGrad)" stroke-width="1.8" stroke-linecap="round" fill="none" opacity="0.85"/>
      <path d="M32 22C26 26 20 30 17 34" stroke="url(#sVeinGrad)" stroke-width="0.8" stroke-linecap="round" fill="none" opacity="0.45"/>
      <path d="M32 30C38 33 43 36 46 39" stroke="url(#sVeinGrad)" stroke-width="0.8" stroke-linecap="round" fill="none" opacity="0.45"/>
      <path d="M32 38C27 40 22 43 19 46" stroke="url(#sVeinGrad)" stroke-width="0.8" stroke-linecap="round" fill="none" opacity="0.35"/>
    </g>
    <!-- Wordmark centered below -->
