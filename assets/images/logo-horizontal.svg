<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 56" width="280" height="56">
  <defs>
    <linearGradient id="hLeafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2d6a56"/>
      <stop offset="50%" stop-color="#1b4d3e"/>
      <stop offset="100%" stop-color="#0f2e1f"/>
    </linearGradient>
    <linearGradient id="hVeinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c8a46f"/>
      <stop offset="100%" stop-color="#b08d5d"/>
    </linearGradient>
    <linearGradient id="hLeafSheen" x1="0%" y1="0%" x2="60%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.18)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </linearGradient>
    <filter id="hSoftShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0a1f15" flood-opacity="0.2"/>
    </filter>
  </defs>
  <g filter="url(#hSoftShadow)">
