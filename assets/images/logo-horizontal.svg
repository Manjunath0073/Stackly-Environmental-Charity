      <path d="M32 6C22 14 10 24 10 36c0 10 9.8 18 22 18s22-8 22-18c0-10-12-20-22-30z" fill="url(#hLeafSheen)"/>
      <path d="M32 54c0-16 6-24 14-30-6 4-14 10-14 30z" fill="rgba(15,46,31,0.3)"/>
      <path d="M32 12C32 12 32 28 32 50" stroke="url(#hVeinGrad)" stroke-width="1.8" stroke-linecap="round" fill="none" opacity="0.85"/>
      <path d="M32 22C26 26 20 30 17 34" stroke="url(#hVeinGrad)" stroke-width="0.8" stroke-linecap="round" fill="none" opacity="0.45"/>
      <path d="M32 30C38 33 43 36 46 39" stroke="url(#hVeinGrad)" stroke-width="0.8" stroke-linecap="round" fill="none" opacity="0.45"/>
      <path d="M32 38C27 40 22 43 19 46" stroke="url(#hVeinGrad)" stroke-width="0.8" stroke-linecap="round" fill="none" opacity="0.35"/>
    </g>
    <!-- Wordmark: Stackly (bold) + Earth (light) -->
    <text x="54" y="37" font-family="'Playfair Display', Georgia, 'Times New Roman', serif" font-weight="700" font-size="28" fill="#0f2e1f" letter-spacing="-0.5">Stackly</text>
    <text x="188" y="37" font-family="'Playfair Display', Georgia, 'Times New Roman', serif" font-weight="400" font-size="28" fill="#1b4d3e" letter-spacing="-0.5" opacity="0.85">Earth</text>
    <!-- Subtle gold underline accent -->
    <rect x="54" y="42" width="198" height="1.5" rx="0.75" fill="url(#hVeinGrad)" opacity="0.4"/>
