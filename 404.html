<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description" content="Page not found — The page you're looking for doesn't exist, but our mission to restore the Earth continues." />
  <title>404 — Page Not Found | StacklyEarth</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="css/global.css" />
  <link rel="stylesheet" href="css/404.css" />
</head>
<body>
  <!-- Floating particles canvas -->
  <canvas class="error__particles" id="particles-canvas" aria-hidden="true"></canvas>

  <!-- Background -->
  <div class="error__bg" aria-hidden="true">
    <div class="error__bg-image"></div>
    <div class="error__bg-overlay"></div>
    <div class="error__bg-grain"></div>
  </div>

  <!-- Main Content -->
  <main class="error" role="main">
    <div class="error__content">
      <!-- Animated leaf icon -->
      <div class="error__icon" aria-hidden="true">
        <svg viewBox="0 0 80 80" class="error__leaf">
          <path d="M40 8C28 8 16 20 16 36c0 12 8 22 18 28l6 8 6-8c10-6 18-16 18-28C64 20 52 8 40 8z" fill="none" stroke="currentColor" stroke-width="2"/>
          <path d="M40 18v32M30 30c4 2 6 6 10 8M50 30c-4 2-6 6-10 8" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
      </div>

      <!-- Error code -->
      <h1 class="error__code">404</h1>

      <!-- Subheading -->
      <h2 class="error__title">Page Not Found</h2>

      <!-- Emotional message -->
      <p class="error__message">
        Looks like this path has vanished into the wild.
        But don't worry — together we can still make a difference.
      </p>

      <!-- Search bar -->
      <form class="error__search" action="index.html" method="get" role="search">
        <label for="error-search" class="visually-hidden">Search our site</label>
        <input type="text" id="error-search" name="q" placeholder="Search for projects, causes, or ways to help..." autocomplete="off" />
        <button type="submit" class="error__search-btn" aria-label="Search">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
        </button>
      </form>

      <!-- Action buttons -->
      <div class="error__actions">
        <button class="btn btn--primary btn--large error__btn" id="go-back">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
          Go Back
        </button>
        <a href="index.html" class="btn btn--outline btn--large error__btn error__btn--light">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
          Go to Home
        </a>
      </div>

      <!-- Helpful links -->
      <nav class="error__links" aria-label="Helpful links">
        <span class="error__links-label">Or explore:</span>
        <a href="projects.html" class="error__link">Projects</a>
        <a href="about.html" class="error__link">About Us</a>
        <a href="get-involved.html" class="error__link">Get Involved</a>
        <a href="contact.html" class="error__link">Contact</a>
      </nav>
    </div>

    <!-- Scroll indicator -->
    <div class="error__scroll" aria-hidden="true">
      <span class="error__scroll-text">Scroll to discover</span>
      <span class="error__scroll-line"></span>
    </div>
  </main>

  <script src="js/main.js"></script>
  <script src="js/404.js"></script>
</body>
</html>
